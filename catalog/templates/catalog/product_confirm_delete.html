{% extends "base.html" %}
{% load static %}

{% block title %}Удаление продукта{% endblock %}

{% block content %}
  <h2>Удалить продукт "{{ product.name }}"?</h2>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-secondary">Отмена</a>
  </form>
{% endblock %}
